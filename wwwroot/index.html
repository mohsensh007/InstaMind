<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InstaMind — دستیار دایرکت اینستاگرام</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5.5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.2" cy="6.8" r="1.1" fill="#fff" stroke="none" />
          </svg>
        </div>
        <div class="brand-text">
          <strong>InstaMind</strong>
          <span>دستیار دایرکت</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-page="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
          <span>داشبورد</span>
        </button>
        <button class="nav-item" data-page="connection">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l1.41-1.41a5 5 0 0 0-7.07-7.07L10.5 5.5"/><path d="M14 11a5 5 0 0 0-7.07 0L5.5 12.4a5 5 0 0 0 7.07 7.07l.9-.9"/></svg>
          <span>صفحات اینستاگرام</span>
          <em class="nav-badge" id="nav-pages-count" hidden>0</em>
        </button>
        <button class="nav-item" data-page="browser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2.5"/><path d="M3 8h18"/><circle cx="6" cy="6" r=".8" fill="currentColor" stroke="none"/><circle cx="8.5" cy="6" r=".8" fill="currentColor" stroke="none"/><path d="M9 21h6"/><path d="M12 18v3"/></svg>
          <span>حالت مرورگر</span>
        </button>
        <button class="nav-item" data-page="ai">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
          <span>سرویس‌های AI</span>
          <em class="nav-badge" id="nav-ais-count" hidden>0</em>
        </button>
        <button class="nav-item" data-page="persona">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h7M15 18h5"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="13" cy="18" r="2"/></svg>
          <span>شخصیت و قوانین</span>
        </button>
        <button class="nav-item" data-page="knowledge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5z"/></svg>
          <span>دانشنامه</span>
        </button>
        <button class="nav-item" data-page="inbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.4 9.4 0 0 1-3.8-.8L3 21l1.9-4.6A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>
          <span>گفتگوها</span>
          <em class="nav-badge" id="nav-inbox-count" hidden>0</em>
        </button>
        <button class="nav-item" data-page="lab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5.5 9.2A1.8 1.8 0 0 0 6 21h12a1.8 1.8 0 0 0 1.5-2.8L14 9V3"/><path d="M7.5 15h9"/></svg>
          <span>آزمایشگاه</span>
        </button>
        <button class="nav-item" data-page="guide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.3c-.7.4-1.1 1-1.1 1.8v.4"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg>
          <span>راهنمای اتصال</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="status-card" id="status-card">
          <div class="status-row"><span class="dot" id="dot-mode"></span><span id="mode-label">در حال بارگذاری…</span></div>
          <div class="status-row"><span class="dot" id="dot-ai"></span><span id="ai-label" class="ellipsis">—</span></div>
        </div>
        <div class="version">InstaMind · نسخهٔ ۱.۰</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-titles">
          <h1 id="page-title">داشبورد</h1>
          <p id="page-sub">نمای کلی دستیار</p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <main id="view" class="view">
        <div class="loading">در حال بارگذاری…</div>
      </main>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="modal" class="modal" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
